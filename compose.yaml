name: broker
services:
  ingress:
    build: { context: ., target: ingress }
    ports: ["127.0.0.1:4310:4310", "127.0.0.1:4311:4311"]
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro"]
    networks: [edge, control]
    read_only: true
    tmpfs:
      ["/data:rw,nosuid,nodev,size=16m", "/config:rw,nosuid,nodev,size=16m"]
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 32
    depends_on:
      trusted: { condition: service_healthy }
      gateway: { condition: service_healthy }
  trusted:
    build: { context: ., target: runtime }
    init: true
    environment:
      BROKER_BIND: 0.0.0.0
      BROKER_INTERNAL_BIND: 0.0.0.0
      BROKER_OWNER_ORIGIN: http://127.0.0.1:4310
      BROKER_INTERNAL_KEY_FILE: /run/secrets/internal
      BROKER_SETUP_TOKEN_FILE: /run/secrets/setup
    volumes: ["vault:/app/data"]
    secrets: [internal, setup]
    networks: [control]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=512m"]
    shm_size: 512mb
    cap_drop: [ALL]
    security_opt:
      ["no-new-privileges:true", "seccomp=./deploy/seccomp_profile.json"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 75s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4310/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  gateway:
    build: { context: ., target: gateway }
    init: true
    environment:
      BROKER_BIND: 0.0.0.0
      BROKER_INTERNAL_URL: http://trusted:4312
      BROKER_INTERNAL_KEY_FILE: /run/secrets/internal
    secrets: [internal]
    networks: [control]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    stop_grace_period: 75s
    depends_on:
      trusted: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4311/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  edge:
  control: { internal: true }
volumes:
  vault:
secrets:
  internal: { file: ./.secrets/internal }
  setup: { file: ./.secrets/setup }
