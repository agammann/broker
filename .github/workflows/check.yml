name: Broker checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: broker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm audit --audit-level=low
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pnpm package:release
      - run: pnpm test:consumer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-22.04'
        with:
          name: broker-release
          path: release-artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: broker-browser-${{ matrix.os }}
          path: test-results/
  compose:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Initialize disposable fixture secrets
        run: |
          node scripts/init.mjs
          node scripts/fixture-init.mjs
          chmod 640 .secrets/internal .secrets/setup .secrets/fixture-users.json
          sudo chown 1000:"$(id -g)" .secrets/internal .secrets/setup .secrets/fixture-users.json
      - run: docker compose -p broker-verification -f compose.yaml -f compose.fixture.yaml up --build -d --wait
      - run: node --import tsx tests/compose-smoke.ts
      - name: Remove this disposable CI stack
        if: always()
        run: docker compose -p broker-verification -f compose.yaml -f compose.fixture.yaml down --volumes --remove-orphans
  artifact-transfer:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download source artifact (first attempt)
        id: download1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: broker-release
          path: release-artifacts
      - name: Wait before second attempt
        if: steps.download1.outcome == 'failure'
        run: sleep 10
      - name: Download source artifact (second attempt)
        id: download2
        if: steps.download1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: broker-release
          path: release-artifacts
      - name: Wait before final attempt
        if: steps.download2.outcome == 'failure'
        run: sleep 20
      - name: Download source artifact (final attempt)
        if: steps.download2.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: broker-release
          path: release-artifacts
      - name: Verify and unpack the exact source
        run: python scripts/unpack-release.py "$RUNNER_TEMP/broker-transfer-${{ github.run_id }}"
  artifact-missing-guard:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Probe a nonexistent artifact
        id: missing
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: broker-nonexistent-transfer-guard
      - name: Reject an unexpected missing-artifact result
        if: always() && steps.missing.outcome != 'failure'
        run: exit 1
  publish:
    needs: [verify, compose, artifact-transfer, artifact-missing-guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download source artifact (first attempt)
        id: download1
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: broker-release
          path: release-artifacts
      - name: Wait before second attempt
        if: steps.download1.outcome == 'failure'
        run: sleep 10
      - name: Download source artifact (second attempt)
        id: download2
        if: steps.download1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: broker-release
          path: release-artifacts
      - name: Wait before final attempt
        if: steps.download2.outcome == 'failure'
        run: sleep 20
      - name: Download source artifact (final attempt)
        if: steps.download2.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: broker-release
          path: release-artifacts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { default: publish } = await import(process.env.GITHUB_WORKSPACE + '/scripts/release.mjs');
            await publish({ github, context, core });
